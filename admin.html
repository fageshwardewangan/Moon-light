<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Light - Live Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f141c; color: #f5f6fa; padding: 25px; }
        
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
            border-bottom: 2px solid #1e272e; 
            padding-bottom: 20px; 
        }
        header h1 { color: #ffdd59; font-size: 2rem; font-weight: 700; text-transform: uppercase; }
        header p { color: #2ed573; font-weight: bold; font-size: 1rem; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        
        /* Admin Order Card Design */
        .order-card { background: #1e272e; border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-top: 6px solid #ffdd59; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 1px solid #2f3542; padding-bottom: 8px; color: #ffdd59; }
        .order-body { min-height: 80px; }
        .order-item { display: flex; justify-content: space-between; font-size: 1.05rem; margin: 8px 0; color: #dcdde1; }
        
        .complete-btn { width: 100%; background: #2ed573; color: #1e272e; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .complete-btn:hover { background: #26af5f; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🌙 Moon Light Restaurant - लाइव काउंटर</h1>
        <p>● सिस्टम ऑनलाइन है (Rajim VIP Road)</p>
    </header>

    <div class="grid" id="orders-container">
        <!-- लाइव ऑर्डर्स यहाँ दिखाई देंगे -->
    </div>

    <script>
        const FIREBASE_URL = https://console.firebase.google.com/project/moon-light-restaurant-a2b76/database/moon-light-restaurant-a2b76-default-rtdb/data/~2F;
        let isFirstLoad = true;

        function playAlertSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); 
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            setTimeout(() => osc.stop(), 400);
        }

        function listenToOrders() {
            const source = new EventSource(`${FIREBASE_URL}/orders.json`);
            source.addEventListener('put', function(event) {
                const data = JSON.parse(event.data);
                if (data && data.data && !isFirstLoad) {
                    playAlertSound();
                }
                isFirstLoad = false;
                fetchCurrentOrders();
            });
        }

        function fetchCurrentOrders() {
            fetch(`${FIREBASE_URL}/orders.json`)
            .then(res => res.json())
            .then(orders => {
                const container = document.getElementById('orders-container');
                container.innerHTML = "";

                for (let key in orders) {
                    if (orders[key].status === "Pending") {
                        const order = orders[key];
                        let itemsHtml = "";
                        
                        for (let id in order.items) {
                            itemsHtml += `<div class="order-item">
                                <span>${order.items[id].name} x ${order.items[id].qty}</span>
                                <span>₹${order.items[id].price * order.items[id].qty}</span>
                            </div>`;
                        }

                        const card = document.createElement('div');
                        card.className = "order-card";
                        card.innerHTML = `
                            <div class="card-header">
                                <span>🏠 कैबिन नंबर: ${order.cabin}</span>
                            </div>
                            <div class="card-body">${itemsHtml}</div>
                            <button class="complete-btn" onclick="completeOrder('${key}')">सर्व हो गया (Clear)</button>
                        `;
                        container.appendChild(card);
                    }
                }
            });
        }

        function completeOrder(key) {
            fetch(`${FIREBASE_URL}/orders/${key}.json`, {
                method: 'PATCH',
                body: JSON.stringify({ status: "Completed" })
            }).then(() => fetchCurrentOrders());
        }

        fetchCurrentOrders();
        listenToOrders();
    </script>
</body>
</html>
