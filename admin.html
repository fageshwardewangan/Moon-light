<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen POS Dashboard - Moon Light Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e272e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2f3640;
            padding: 15px 25px;
            border-radius: 8px;
            border-bottom: 3px solid #f4d03f;
            margin-bottom: 20px;
        }
        .header h1 { margin: 0; color: #f4d03f; font-size: 24px; }
        .sound-btn {
            background: #e1b12c;
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .order-card {
            background: #ffffff;
            color: #2f3640;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border-top: 6px solid #e84118;
        }
        .order-card.completed {
            border-top-color: #4cd137;
            opacity: 0.7;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .cabin-badge {
            background: #e84118;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
        }
        .item-list { list-style: none; padding: 0; margin: 0 0 15px 0; }
        .item-list li {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #f1f2f6;
            font-size: 15px;
        }
        .total-row {
            font-size: 18px;
            font-weight: bold;
            text-align: right;
            color: #27ae60;
            margin-bottom: 15px;
        }
        .actions { display: flex; gap: 10px; }
        .btn-done {
            flex: 1;
            background: #4cd137;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-print {
            background: #353b48;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-del {
            background: #c23616;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>🌙 Moon Light Kitchen Counter POS</h1>
        <small>Live Orders Screen (Auto-Refreshing)</small>
    </div>
    <button class="sound-btn" id="soundBtn" onclick="enableSound()">🔔 Enable Sound Alert</button>
</div>

<div class="orders-grid" id="orders-container">
    <p>Orders load ho rahe hain...</p>
</div>

<!-- Notification Sound -->
<audio id="alertSound" src="https://mixkit.co" preload="auto"></audio>

<script>
    // APNA FIREBASE DATABASE URL YAHAN DALEIN
    const FIREBASE_URL = "https://moon-light-restaurant-a2b76-default-rtdb.firebaseio.com";
    
    let knownOrderIds = new Set();
    let isFirstLoad = true;
    let soundEnabled = false;

    function enableSound() {
        soundEnabled = true;
        const audio = document.getElementById("alertSound");
        audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
        });
        const btn = document.getElementById("soundBtn");
        btn.innerText = "🔊 Sound Alert ON";
        btn.style.background = "#4cd137";
        btn.style.color = "#fff";
    }

    async function fetchOrders() {
        try {
            const res = await fetch(`${FIREBASE_URL}/orders.json`);
            const data = await res.json();
            const container = document.getElementById("orders-container");
            
            if (!data) {
                container.innerHTML = "<p>Abhi koi active order nahi hai.</p>";
                return;
            }

            let html = "";
            let newOrderArrived = false;

            const orderKeys = Object.keys(data).reverse(); // Naye order upar dikhenge

            orderKeys.forEach(key => {
                const order = data[key];
                if (!knownOrderIds.has(key)) {
                    knownOrderIds.add(key);
                    if (!isFirstLoad && order.status === "Pending") {
                        newOrderArrived = true;
                    }
                }

                let itemsHtml = "";
                order.items.forEach(i => {
                    itemsHtml += `<li><span>${i.name} <strong>x${i.qty}</strong></span> <span>₹${i.price}</span></li>`;
                });

                html += `
                    <div class="order-card ${order.status === 'Completed' ? 'completed' : ''}">
                        <div class="card-header">
                            <span class="cabin-badge">${order.cabin}</span>
                            <span>🕒 ${order.time} | 👤 ${order.customer}</span>
                        </div>
                        <ul class="item-list">${itemsHtml}</ul>
                        <div class="total-row">Total Bill: ₹${order.total}</div>
                        <div class="actions">
                            ${order.status === 'Pending' 
                                ? `<button class="btn-done" onclick="markDone('${key}')">✔ Complete</button>` 
                                : `<button class="btn-done" style="background:#7f8fa6" disabled>Served</button>`}
                            <button class="btn-print" onclick="printBill('${order.cabin}', '${order.customer}', '${order.time}', ${order.total}, '${encodeURIComponent(JSON.stringify(order.items))}')">🖨️ Bill</button>
                            <button class="btn-del" onclick="deleteOrder('${key}')">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;

            if (newOrderArrived && soundEnabled) {
                document.getElementById("alertSound").play();
            }
            isFirstLoad = false;

        } catch (err) {
            console.error("Error fetching orders:", err);
        }
    }

    async function markDone(id) {
        await fetch(`${FIREBASE_URL}/orders/${id}.json`, {
            method: "PATCH",
            body: JSON.stringify({ status: "Completed" })
        });
        fetchOrders();
    }

    async function deleteOrder(id) {
        if(confirm("Kya aap is order ko delete karna chahte hain?")) {
            await fetch(`${FIREBASE_URL}/orders/${id}.json`, {
                method: "DELETE"
            });
            fetchOrders();
        }
    }

    function printBill(cabin, customer, time, total, itemsJson) {
        const items = JSON.parse(decodeURIComponent(itemsJson));
        let receipt = `
            <div style="font-family:monospace; width:280px; padding:10px;">
                <h2 style="text-align:center; margin:0;">MOON LIGHT RESTAURANT</h2>
                <p style="text-align:center; font-size:11px; margin:4px 0;">Near PWD Rest House, VIP Road Rajim, Gobra Nawapara, CG 493885</p>
                <hr>
                <p><strong>${cabin}</strong> | Guest: ${customer}<br>Time: ${time}</p>
                <hr>
                <table style="width:100%; font-size:13px;">
        `;
        items.forEach(i => {
            receipt += `<tr><td>${i.name} x${i.qty}</td><td style="text-align:right;">₹${i.price}</td></tr>`;
        });
        receipt += `
                </table>
                <hr>
                <h3 style="text-align:right;">Total: ₹${total}</h3>
                <p style="text-align:center; font-size:12px;">Thank You! Visit Again</p>
            </div>
        `;
        const printWin = window.open('', '', 'width=320,height=500');
        printWin.document.write(receipt);
        printWin.document.close();
        printWin.print();
    }

    // Har 3 second mein naye order check karega
    setInterval(fetchOrders, 3000);
    fetchOrders();
</script>
</body>
</html>
