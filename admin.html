<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Light - Live Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f141c; color: #f5f6fa; padding: 25px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #1e272e; padding-bottom: 20px; }
        header h1 { color: #ffdd59; font-size: 2rem; font-weight: 700; text-transform: uppercase; }
        header p { color: #2ed573; font-weight: bold; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }
        .order-card { background: #1e272e; border-radius: 16px; padding: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.3); border-top: 6px solid #ffdd59; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 1.2rem; border-bottom: 1px solid #2f3542; padding-bottom: 8px; color: #ffdd59; }
        .order-item { display: flex; justify-content: space-between; font-size: 1.05rem; margin: 8px 0; color: #dcdde1; }
        .complete-btn { width: 100%; background: #2ed573; color: #1e272e; border: none; padding: 12px; border-radius: 8px; margin-top: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .complete-btn:hover { background: #26af5f; color: white; }
    </style>
</head>
<body>

    <header>
        <h1>🌙 Moon Light Restaurant - लाइव काउंटर</h1>
        <p id="system-status">● सिस्टम ऑनलाइन है (Rajim VIP Road)</p>
    </header>

    <div class="grid" id="orders-container">
        <p style='color: #a4b0be;'>ऑर्डर्स लोड हो रहे हैं...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, onValue, update } from "https://gstatic.com";

        const firebaseConfig = {
            apiKey: "AIzaSyCi11FWl4N4pLQ3nq1eYUzek7882cfwCns",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://moon-light-restaurant-a2b76-default-rtdb.firebaseio.com",
            projectId: "moon-light-restaurant-a2b76",
            storageBucket: "moon-light-restaurant-a2b76.firebasestorage.app",
            messagingSenderId: "447549147766",
            appId: "1:447549147766:web:63543b03aee7d96e156d57"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let isFirstLoad = true;

        function playAlertSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = "sine";
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); 
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 400);
            } catch(e) {
                console.log("साउंड अलर्ट चालू करने के लिए एक बार स्क्रीन पर क्लिक करें");
            }
        }

        // आधुनिक रीयल-टाइम डेटाबेस लिसनर
        onValue(ref(database, 'orders'), (snapshot) => {
            const orders = snapshot.val();
            const container = document.getElementById('orders-container');
            container.innerHTML = "";

            if (!orders) {
                container.innerHTML = "<p style='color: #a4b0be;'>अभी कोई पेंडिंग ऑर्डर नहीं है।</p>";
                isFirstLoad = false;
                return;
            }

            let hasNewPending = false;
            let count = 0;

            for (let key in orders) {
                if (orders[key].status === "Pending") {
                    count++;
                    const order = orders[key];
                    let itemsHtml = "";
                    
                    for (let id in order.items) {
                        itemsHtml += `<div class="order-item">
                            <span>${order.items[id].name} x ${order.items[id].qty}</span>
                            <span>₹${order.items[id].price * order.items[id].qty}</span>
                        </div>`;
                    }

                    const card = document.createElement('div');
                    card.className = "order-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <span>🏠 कैबिन नंबर: ${order.cabin}</span>
                        </div>
                        <div class="card-body">${itemsHtml}</div>
                        <button class="complete-btn" onclick="window.completeOrder('${key}')">सर्व हो गया (Clear)</button>
                    `;
                    container.appendChild(card);
                    hasNewPending = true;
                }
            }

            if (!isFirstLoad && hasNewPending) {
                playAlertSound();
            }
            
            isFirstLoad = false;

            if(count === 0) {
                container.innerHTML = "<p style='color: #a4b0be;'>अभी कोई पेंडिंग ऑर्डर नहीं है।</p>";
            }
        });

        window.completeOrder = function(key) {
            update(ref(database, 'orders/' + key), {
                status: "Completed"
            });
        }

        document.body.addEventListener('click', function() {
            console.log("साउंड रेडी");
        });
    </script>
</body>
</html>
