<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Light Restaurant - Digital Menu</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
            background-color: #fdf6e3;
            background-image: linear-gradient(rgba(255, 250, 240, 0.90), rgba(255, 250, 240, 0.92)), 
                              url('https://unsplash.com');
            background-size: cover;
            background-attachment: fixed;
            color: #333;
        }
        header {
            background-color: #2c1e16;
            color: #f4d03f;
            text-align: center;
            padding: 18px 15px;
            border-bottom: 4px solid #d4ac0d;
        }
        header h1 { margin: 0; font-size: 26px; }
        header p { margin: 5px 0 0; font-size: 12px; color: #ecf0f1; font-family: Arial, sans-serif; }
        .veg-badge {
            display: inline-block;
            background: #27ae60;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 6px;
            font-family: Arial, sans-serif;
        }
        .collage {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            padding: 6px;
            background: #2c1e16;
        }
        .collage img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #d4ac0d;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 100px; }
        .cabin-box {
            background: #fff;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border-left: 5px solid #d4ac0d;
            font-family: Arial, sans-serif;
        }
        .cabin-box select, .cabin-box input {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 15px;
            box-sizing: border-box;
        }
        .menu-item {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #e0d6c3;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-info h3 { margin: 0 0 4px; font-size: 17px; color: #2c1e16; }
        .item-info span { font-weight: bold; color: #27ae60; font-family: Arial, sans-serif; }
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn {
            background: #d4ac0d;
            color: #2c1e16;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
        .qty-val { font-size: 16px; font-weight: bold; font-family: Arial, sans-serif; min-width: 20px; text-align: center; }
        .order-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #2c1e16;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        #success-msg {
            display: none;
            background: #d4edda;
            color: #155724;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin: 20px;
            font-family: Arial, sans-serif;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>

<header>
    <h1>🌙 Moon Light Restaurant</h1>
    <p>Near PWD Rest House, VIP Road Rajim, Gobra Nawapara, Chhattisgarh 493885</p>
    <div class="veg-badge">🌿 100% Pure Veg Menu</div>
</header>

<div class="collage">
    <img src="https://unsplash.com" alt="Paneer Chilli">
    <img src="https://unsplash.com" alt="Fried Rice">
    <img src="https://unsplash.com" alt="Dessert">
</div>

<div class="container" id="main-container">
    <div class="cabin-box">
        <label><strong>Select Cabin / Table:</strong></label>
        <select id="cabinSelect">
            <option value="Cabin 1">Cabin 1</option>
            <option value="Cabin 2">Cabin 2</option>
            <option value="Cabin 3">Cabin 3</option>
            <option value="Cabin 4">Cabin 4</option>
            <option value="Cabin 5">Cabin 5</option>
            <option value="Cabin 6">Cabin 6</option>
        </select>
        <input type="text" id="custName" placeholder="Aapka Naam (Optional)">
    </div>

    <div id="menu-list"></div>
</div>

<div id="success-msg">
    <h2>✅ Order Sent to Kitchen!</h2>
    <p>Aapka order kitchen counter par pahunch gaya hai. Kripya thoda intezar karein.</p>
    <button onclick="location.reload()" style="padding:10px 20px; background:#2c1e16; color:#f4d03f; border:none; border-radius:5px; margin-top:10px; cursor:pointer;">Aur Order Karein</button>
</div>

<div class="order-bar" id="order-bar">
    <div>
        <div style="font-size: 12px; color: #ccc;">Total Amount (Pay at Counter)</div>
        <div style="font-size: 20px; font-weight: bold; color: #f4d03f;">₹<span id="total-price">0</span></div>
    </div>
    <button class="order-btn" id="confirmBtn" onclick="placeOrder()">Confirm Order ✔</button>
</div>

<script>
    // APNA FIREBASE DATABASE URL YAHAN DALEIN (Aakhiri mein slash '/' na lagayein)
    const FIREBASE_URL = "https://moon-light-restaurant-a2b76-default-rtdb.firebaseio.com";

    // URL se automatic cabin detect karein (e.g. ?cabin=1)
    const urlParams = new URLSearchParams(window.location.search);
    const cabinParam = urlParams.get('cabin');
    if (cabinParam) {
        document.getElementById("cabinSelect").value = "Cabin " + cabinParam;
    }

    const menuItems = [
        { id: 1, name: "Paneer Chilli", price: 170 },
        { id: 2, name: "Fried Rice", price: 150 },
        { id: 3, name: "Corn Chilli", price: 150 },
        { id: 4, name: "Crispy Corn", price: 130 },
        { id: 5, name: "Soya Chilli", price: 130 },
        { id: 6, name: "Ice Cream", price: 70 },
        { id: 7, name: "Milk Shake", price: 80 },
        { id: 8, name: "Water Bottle", price: 20 }
    ];

    let cart = {};

    function renderMenu() {
        const list = document.getElementById("menu-list");
        list.innerHTML = "";
        menuItems.forEach(item => {
            const qty = cart[item.id] || 0;
            list.innerHTML += `
                <div class="menu-item">
                    <div class="item-info">
                        <h3>${item.name}</h3>
                        <span>₹${item.price}</span>
                    </div>
                    <div class="qty-controls">
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <span class="qty-val">${qty}</span>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `;
        });
        calculateTotal();
    }

    function updateQty(id, change) {
        if (!cart[id]) cart[id] = 0;
        cart[id] += change;
        if (cart[id] < 0) cart[id] = 0;
        renderMenu();
    }

    function calculateTotal() {
        let total = 0;
        menuItems.forEach(item => {
            if (cart[item.id]) total += item.price * cart[item.id];
        });
        document.getElementById("total-price").innerText = total;
        return total;
    }

    async function placeOrder() {
        const cabin = document.getElementById("cabinSelect").value;
        const custName = document.getElementById("custName").value.trim() || "Guest";
        const total = calculateTotal();

        let orderedItems = [];
        menuItems.forEach(item => {
            if (cart[item.id] > 0) {
                orderedItems.push({
                    name: item.name,
                    qty: cart[item.id],
                    price: item.price * cart[item.id]
                });
            }
        });

        if (orderedItems.length === 0) {
            alert("Kripya kam se kam ek item select karein!");
            return;
        }

        const btn = document.getElementById("confirmBtn");
        btn.disabled = true;
        btn.innerText = "Sending...";

        const orderData = {
            cabin: cabin,
            customer: custName,
            items: orderedItems,
            total: total,
            status: "Pending",
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        try {
            await fetch(`${FIREBASE_URL}/orders.json`, {
                method: "POST",
                body: JSON.stringify(orderData)
            });

            document.getElementById("main-container").style.display = "none";
            document.getElementById("order-bar").style.display = "none";
            document.getElementById("success-msg").style.display = "block";
        } catch (error) {
